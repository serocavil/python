  - name: Configure Git
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"

  - name: Generate new tag
    id: tag
    run: |
      set -euo pipefail

      # Obtener el último tag que cumpla vMAJOR.MINOR.PATCH (si no hay, empieza en v0.0.0)
      LAST_TAG=$(git for-each-ref --sort=-v:refname --format='%(refname:strip=2)' refs/tags \
        | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
        | head -n1 || echo "v0.0.0")
      echo "Último tag: $LAST_TAG"

      # Extraer números y aumentar parche
      IFS='.' read -r major minor patch <<<"${LAST_TAG#v}"
      NEW_TAG="v${major}.${minor}.$((patch + 1))"
      echo "Nuevo tag: $NEW_TAG"

      # Crear y empujar el tag usando las credenciales persistidas
      git tag "$NEW_TAG"
      git push origin "refs/tags/$NEW_TAG"

      echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

  - name: Llamar al servidor vía API
    run: |
      curl -s -X POST \
        -H "Authorization: Bearer ${{ secrets.SERVER_TOKEN }}" \
        -H "Content-Type: application/json" \
        -d "{\"repository\": \"${{ github.repository }}\", \"tag\": \"${{ steps.tag.outputs.tag }}\"}" \
        https://your-server.example/api/deploy
